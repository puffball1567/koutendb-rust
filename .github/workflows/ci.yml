name: ci

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            kouten_lib: libkoutendb.so
          - os: macos-latest
            kouten_lib: libkoutendb.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Rust driver
        uses: actions/checkout@v4

      - name: Checkout KoutenDB core
        uses: actions/checkout@v4
        with:
          repository: puffball1567/koutendb
          ref: d6ccfa37fbf66231b36cc7de63a8668815f6a97f
          path: koutendb-core

      - name: Install Nim on Linux
        if: runner.os == 'Linux'
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"

      - name: Install Nim on macOS
        if: runner.os == 'macOS'
        run: brew install nim

      - name: Install libsodium on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libssl-dev pkg-config

      - name: Install libsodium on macOS
        if: runner.os == 'macOS'
        run: brew install libsodium openssl@3

      - name: Configure macOS libsodium paths
        if: runner.os == 'macOS'
        run: |
          prefix="$(brew --prefix libsodium)"
          echo "LIBRARY_PATH=$prefix/lib:$LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "CPATH=$prefix/include:$CPATH" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$prefix/lib:$DYLD_LIBRARY_PATH" >> "$GITHUB_ENV"
          ssl="$(brew --prefix openssl@3)"
          echo "$ssl/bin" >> "$GITHUB_PATH"
          echo "DYLD_LIBRARY_PATH=$ssl/lib:$prefix/lib" >> "$GITHUB_ENV"
          echo "OPENSSL_DIR=$ssl" >> "$GITHUB_ENV"

      - name: Build KoutenDB C ABI
        run: |
          cd koutendb-core
          nimble install -y
          KOUTENDB_CAPI_OUT=lib/${{ matrix.kouten_lib }} bash scripts/build_capi.sh

      - name: Test Rust driver
        run: cargo test --all-features
        env:
          KOUTENDB_CORE_DIR: ${{ github.workspace }}/koutendb-core
          LD_LIBRARY_PATH: ${{ github.workspace }}/koutendb-core/lib
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/koutendb-core/lib

      - name: Test TCP without C ABI linkage
        run: |
          cargo test --no-default-features --features tcp
          cargo build --no-default-features --features tcp --example tcp_adapter
          bash koutendb-core/scripts/native_driver_conformance.sh "$PWD/target/debug/examples/tcp_adapter"
