[package]
name = "koutendb"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust driver for KoutenDB"
repository = "https://github.com/puffball1567/koutendb-rust"
homepage = "https://github.com/puffball1567/koutendb"
documentation = "https://puffball1567.github.io/koutendb/"
readme = "README.md"
keywords = ["database", "nosql", "vector", "ffi", "koutendb"]
categories = ["api-bindings", "database"]
build = "build.rs"

[lib]
name = "koutendb"
path = "src/lib.rs"

[features]
default = ["ffi"]
ffi = []
tcp = ["dep:native-tls", "dep:crypto_secretbox", "dep:blake2", "dep:rand", "dep:serde_json", "dep:zeroize"]

[dependencies]
native-tls = { version = "0.2", optional = true }
crypto_secretbox = { version = "0.1", optional = true }
blake2 = { version = "0.10", optional = true }
rand = { version = "0.8", optional = true }
serde_json = { version = "1", optional = true }
zeroize = { version = "1", optional = true }

[dev-dependencies]
base64 = "0.22"

[[example]]
name = "embedded"
required-features = ["ffi"]

[[example]]
name = "cluster_tls"
required-features = ["ffi"]

[[example]]
name = "sec_probe"
required-features = ["ffi"]

[[example]]
name = "tcp_adapter"
required-features = ["tcp"]
